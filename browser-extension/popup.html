<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>DoomScroll</title></head>
<body>
  <header><b>DoomScroll</b><span id="dot">●</span></header>
  <p id="status">Comprobando conexión…</p>
  <button id="open" class="primary">Abrir Instagram Reels</button>
  <div class="controls"><button data-command="PREVIOUS">←</button><button data-command="NEXT">Siguiente →</button></div>
  <button id="reconnect">Reconectar con VS Code</button>
  <small>VS Code debe estar abierto con DoomScroll activo. La conexión solo usa localhost:8765.</small>
  <script src="popup.js"></script>
</body>
</html>
